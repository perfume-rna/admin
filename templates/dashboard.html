<!--New version-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.2/dist/sql-wasm.js"></script>
<title>Perfume RNA Dashboard</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

#container{
    display:flex;
    min-height:100vh;
}

/* ================= Sidebar ================= */

#sidebar{
    width:280px;
    background:white;
    border-right:1px solid #ddd;
    padding:20px;
}

#profile-sidebar{
    text-align:center;
    margin-bottom:40px;
}

#profile-sidebar img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:10px;
}

#profile-sidebar p{
    font-size:18px;
    font-weight:bold;
}

#sidebar-selection{
    display:flex;
    flex-direction:column;
    gap:10px;
}

#sidebar-selection div{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 15px;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

#sidebar-selection div:hover{
    background:#efefef;
}

#sidebar-selection i{
    font-style:normal;
    font-size:20px;
}

/* ================= Products ================= */

#products-detail-screen{
    flex:1;
    padding:30px;
}

.page-title{
    margin-bottom:25px;
}

.each-product-details{
    display:flex;
    align-items:center;
    gap:20px;
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product-number{
    width:35px;
    font-size:22px;
    font-weight:bold;
    color:#888;
}

.each-product-details img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:10px;
}

.product-details{
    flex:1;
}

.product-details h3{
    margin-bottom:10px;
}

.product-details p{
    margin:6px 0;
    color:#555;
}

.stock{
    color:green;
    font-weight:bold;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#2b7cff;
    color:white;
    transition:.3s;
}

button:hover{
    background:#0d5ddd;
}

/* ================= Responsive ================= */

@media(max-width:768px){

#container{
    flex-direction:column;
}

#sidebar{
    width:100%;
}

.each-product-details{
    flex-direction:column;
    align-items:flex-start;
}

.product-number{
    display:none;
}

.each-product-details img{
    width:100%;
    height:250px;
}

button{
    width:100%;
}
}


/*==========================
      MODAL
==========================*/

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);

    overflow-y: auto;
    display:none;

    justify-content:center;
    align-items:center;

    padding:30px;

    z-index:9999;

    backdrop-filter:blur(6px);
}

.modal.show{
    display:flex;
    animation:fadeIn .25s ease;
}

.modal-content{

    width:100%;
    max-width:950px;

    background:white;

    border-radius:18px;

    overflow:hidden;

    animation:pop .25s ease;

    box-shadow:0 25px 60px rgba(0,0,0,.2);

}

.modal-header{

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 30px;

    border-bottom:1px solid #ececec;
}

.modal-header h2{
    font-size:24px;
}

.close-btn{

    width:40px;
    height:40px;

    border:none;

    border-radius:50%;

    background:#f3f3f3;

    cursor:pointer;

    font-size:24px;

    transition:.2s;
}

.close-btn:hover{

    background:#e4e4e4;

    transform:rotate(90deg);
}

.modal-body{

    display:flex;

    gap:40px;

    padding:30px;
}

/* Right */

.modal-form{

    flex:1;

    display:flex;

    flex-direction:column;
}

.input-group{

    display:flex;

    flex-direction:column;

    margin-bottom:18px;
}

.input-group label{

    margin-bottom:8px;

    font-weight:bold;

    color:#555;
}

.input-group input,
.input-group textarea,
.input-group select{

    padding:13px;

    border:1px solid #d8d8d8;

    border-radius:8px;

    font-size:15px;

    outline:none;

    transition:.2s;
}

.input-group input:focus,
.input-group textarea:focus,
.input-group select:focus{

    border-color:#2b7cff;

    box-shadow:0 0 0 3px rgba(43,124,255,.15);
}

textarea{

    resize:vertical;
}

.row{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;
}

.button-row{

    display:flex;

    justify-content:flex-end;

    gap:15px;

    margin-top:20px;
}

.button-row button{

    padding:12px 24px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:15px;

    transition:.2s;
}

.cancel{

    background:#ececec;
}

.cancel:hover{

    background:#dddddd;
}

.save{

    background:#2b7cff;

    color:white;
}

.save:hover{

    background:#105edb;
}

@keyframes fadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

@keyframes pop{

    from{

        transform:translateY(20px) scale(.95);

        opacity:0;

    }

    to{

        transform:translateY(0) scale(1);

        opacity:1;

    }

}

@media(max-width:850px){

    .modal-body{

        flex-direction:column;
    }

    .modal-image{

        width:100%;
    }

    .modal-image img{

        width:100%;
        max-width:280px;
        height:auto;
    }

    .row{

        grid-template-columns:1fr;
    }
}

#add-product-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    color: white;
    background-color: blue;
}

#remove-product-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    color: white;
    background-color: red;
}


/*Loading*/
    #loading {
      font-family: Arial, Helvetica, sans-serif;
      border: 0.5px solid black;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      width: 70%;
      background-color: white;
      max-width: 200px;
    }

    #loading_container {
      position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    }

    #loading img {
      width: 60px;
      height: 60px;
    }

    #failed_container{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    }

    #failed {
      font-family: Arial, Helvetica, sans-serif;
      border: 0.5px solid black;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      width: 30%;
      background-color: white;
    }
    
    #failed h2 {
      color: red;
    }
    
    #failed button {
      background-color: #2F3A73;
      color: white;
      font-size: 20px;
      padding: 0 10px;
      border-radius: 8px;
    }

    #failed img {
      width: 90px; 
      height: 90px;
    }

    @media (max-width: 500px) {
      #failed {
        width: 50%;
      }
    }

    #products-detail-section {
       width: 100%;
    }
</style>

</head>

<body>
    <div id="loading_container">
          <div id="loading">
           <img src="https://media1.tenor.com/m/Pq1cZiuhlEEAAAAC/rajinikanth.gif" alt="loading" />
           <p>Loading ...</p>
          </div>
    </div>

    <div id="failed_container">
       <div id="failed">
             <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSL2pcBiB5mWS_hJxDZQEvBMNsakG3P4GygTQ&s" alt="failure" />
             <h2>Failed</h2>
             <p id="error_p_tag"></p>
             <button onclick="document.getElementById('failed_container').style.display = 'none'; ">Close</button>
        </div>
    </div>

<!-- ================= Edit Product Modal ================= -->
<div id="editModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Edit Product</h2>

            <button class="close-btn" onclick="closeModal()">
                &times;
            </button>
        </div>

        <div class="modal-body">

            <!-- Right Side -->

            <form class="modal-form" onsubmit="return false;">

                <input id="previous-name" value="" type="hidden">

                <div class="input-group">
                    <label>Product Name</label>
                    <input id="product-name" type="text" value="Dior Sauvage">
                </div>

                <div class="row">

                    <div class="input-group">
                        <label>Price (RM)</label>
                        <input id="price" type="number" value="450">
                    </div>

                    <div class="input-group">
                        <label>Stock</label>
                        <input id="stock" type="number" value="18">
                    </div>

                </div>

                <div class="input-group">
                    <label>Image Link</label>
                    <input id="image-link" type="text" placeholder="Place image link here"> 
                </div>

                <div class="input-group">
                    <label>Description</label>

                    <textarea rows="4" id="description">
Fresh bergamot with woody amber notes.
                    </textarea>
                </div>

                <button id="remove-product-btn" onclick="removeProduct()" type="button">Remove product</button>

                <div class="button-row">

                    <button
                        type="button"
                        class="cancel"
                        onclick="closeModal()">
                        Cancel
                    </button>

                    <button
                        type="button"
                        class="save"
                        onclick="updateProduct()"
                        id="save-changes-btn"
                    >
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<div id="container">

    <!-- Sidebar -->
    <div id="sidebar">

        <div id="profile-sidebar">
            <img src="https://i.ibb.co/m5DRhxjt/IMG-2065.jpg" alt="Logo Image">
            <p>Perfume RNA</p>
        </div>

        <div id="sidebar-selection">

            <div>
                <i>🏠</i>
                <b>Dashboard</b>
            </div>

            <div>
                <i>📦</i>
                <b>Products</b>
            </div>

            <div>
                <i>🛒</i>
                <b>Orders</b>
            </div>

            <div>
                <i>👥</i>
                <b>Customers</b>
            </div>

            <div>
                <i>⚙️</i>
                <b>Settings</b>
            </div>

        </div>

    </div>

    <!-- Product Screen -->

    <div id="products-detail-screen">

        <h1 class="page-title">Perfume Products</h1>

        <br>
        <button id="add-product-btn" onclick="addProduct()">Add product</button>
        <br>

        <div id="products-detail-section"></div>
    </div>

</div>

</body>
<script>
function openModal(name, stock, price, imageLink, description){
    document.getElementById("product-name").value = name;
    document.getElementById("previous-name").value = name;
    document.getElementById("stock").value = stock;
    document.getElementById("price").value = price;
    document.getElementById("image-link").value = imageLink;
    document.getElementById("description").value = description;
    document.getElementById("editModal").classList.add("show");
}

function closeModal(){
    document.getElementById("editModal").classList.remove("show");
}

// Close when clicking outside
window.onclick = function(e){

    const modal = document.getElementById("editModal");

    if(e.target === modal){
        closeModal();
    }
}


// Initialise database and token 
let db;
    initSqlJs({
        locateFile: file => `https://cdn.jsdelivr.net/npm/sql.js@1.10.2/dist/${file}`
    }).then(SQL => {
        db = new SQL.Database();
        createDB();
        console.log("DB created.");
    });

    let token = String("{{token}}");
    const protocol = window.location.protocol === "https:" ? "wss" : "ws";
    const websocket = new WebSocket(
       `${protocol}://${window.location.host}/ws?token=${token}`
    );

    // Create database
    function createDB() {
        db.run(`
            CREATE TABLE IF NOT EXISTS products_tbl (
                name TEXT,
                quantity INTEGER,
                price TEXT,
                link TEXT,
                description TEXT
            )
        `);
    }

    // Write data to database
    function write_data(products) {
        if (!db) {
            console.log("Error"); 
            document.getElementById("loading_container").style.display = "none";
            error_render("No database created") 
            return;
        }
        console.log("Write");
        db.run("DELETE FROM products_tbl");
        products.forEach(element => {
            db.run(
                "INSERT INTO products_tbl (name, quantity, price, link, description) VALUES (?,?,?,?,?)",
                [element[0], element[1], element[2], element[3], element[4]]
            );
        });
        renderProductList();
        document.getElementById("loading_container").style.display = "none";
    }

    // Error section
    function error_render(message) {
       document.getElementById("error_p_tag").innerText = message;
       document.getElementById("failed_container").style.display = "flex";
    }

    // Add product section
    function renderProductList() {
        const result = db.exec("SELECT name, quantity, price, link, description FROM products_tbl");
        const products = result.length ? result[0].values : [];

        document.getElementById("products-detail-section").innerHTML = "";

        // Add product section
        products.forEach((element, index) => {
            document.getElementById("products-detail-section").innerHTML += `
        <div class="each-product-details">
            <div class="product-number">${index + 1}</div>
            <img src="${element[3]}" alt="Product Image">
            <div class="product-details">
                <h3>${element[0]}</h3>
                <p><strong>Price:</strong> RM${element[2]}</p>
                <p><strong>Description: </strong>${element[4]}</p>
                <p class="stock">Stock Left: ${element[1]}</p>
            </div>
            <button id="btn-${index + 1}" onclick='document.getElementById("remove-product-btn").style.display = "block"; document.getElementById("save-changes-btn").onclick = () => update_product_send("update");'>Edit</button>
        </div>
            `;
            document.getElementById("btn-${index + 1}").addEventListener("click", () => {
              openModal(element[0], element[1], element[2], element[3], element[4]);
            });
        });
    }

    // Send updated product details
    function update_product_send(query) {
        closeModal();
        document.getElementById("loading_container").style.display = "flex";
        let body;
        const product_name = document.getElementById("product-name").value;
        const product_description = document.getElementById("description").value;
        const product_img = document.getElementById("image-link").value;
        const product_qty = document.getElementById("stock").value;
        const product_price = document.getElementById("price").value;
        const product_previous = document.getElementById("previous-name").value;

        if (query == "insert") {
            let products = db.exec("SELECT name FROM products_tbl")[0].values;
            for (let i = 0; i < products.length; i++) {
                if (product_name.trim() == products[i][0]) {
                    alert(`Cannot add similar product name (${product_name})`);
                    return;
                }
            }
        }

        body = {
            "query": query,
            "product_name": product_name,
            "product_qty": product_qty,
            "product_description": product_description,
            "img_link": product_img,
            "product_price": product_price,
            "product_previous": product_previous
        };

        sendWS(body);
    }

    // Send data packet
    function sendWS(payload) {
        if (websocket.readyState === WebSocket.OPEN) {
            websocket.send(JSON.stringify(payload));
        } else {
            error_render("WebSocket not connected. Please try again");
            console.error("WebSocket not connected.");
        }
    }

    websocket.onopen = () => {document.getElementById("loading_container").style.display = "flex"; console.log("WebSocket connected.")};
    websocket.onclose = () => {document.getElementById("loading_container").style.display = "flex"; alert("WebSocket disconnected.")};
    websocket.onerror = (error) => {error_render("Websocket Connection Error. Please reload the whole page."); console.error("WebSocket error:", error)};

    websocket.onmessage = function(event) {
        document.getElementById("loading_container").style.display = "flex";
       setTimeout(() => {
        try {
            const data = JSON.parse(event.data);
            //if (data.message == "success") {console.log("Pass"); write_data(data.data)};
            write_data(data.data);
        } catch(err) {
            console.error(err);
            error_render("Error on updating data");
        }
       }, 1000);
    };

    // Render add new product form
    function addProduct() {
        document.getElementById("remove-product-btn").style.display = "none";

        openModal("", "", "", "", "");

        document.getElementById("save-changes-btn").onclick = () => addNew();
    }

    function removeProduct() {
        update_product_send("delete");
        closeModal();
    }

    function updateProduct() {
        update_product_send("update");
        closeModal();
    }

    function addNew() {
        update_product_send('insert');
        closeModal();
    }
</script>
</html>
